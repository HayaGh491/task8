<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <title>conect card</title>
  </head>
  <body>
    <section class="contact-section">
      <!--header section-->
      <div class="contact-header">
        <h2>contact us</h2>
        <p>
          Lorem ipsum dolor sit, amet consectetur adipisicing elit. Iure tempore
          totam omnis. Temporibus ullam saepe ab ad rerum cum, totam aliquam
          tempora obcaecati in mollitia quia est ut animi vero.
        </p>
      </div>
      <!--contact container-->
      <div class="contact-container">
        <!--contact list-->
        <div class="contact-info">
          <div class="info-item">
            <div class="icon-box">
              <i class="fa solid fa-location-dot"></i>
            </div>
            <div class="detailes">
              <h3>Address</h3>
              <p>your Address</p>
            </div>
          </div>
          <!---->
          <div class="info-item">
            <div class="icon-box">
              <i class="fa solid fa-envelope"></i>
            </div>
            <div class="detailes">
              <h3>Email</h3>
              <p>your Email</p>
            </div>
          </div>
          <!---->
          <div class="info-item">
            <div class="icon-box">
              <i class="fa solid fa-phone"></i>
            </div>
            <div class="detailes">
              <h3>phone</h3>
              <p>your phone</p>
            </div>
          </div>
          <!---->
        </div>
        <!--contact form-->
        <form class="contact-foem">
          <h3>Send Message</h3>
          <div class="input-group">
            <input type="text" placeholder="full Name" required />
          </div>
          <div class="input-group">
            <input type="email" placeholder="Email" required />
          </div>
          <div class="input-group">
            <textarea placeholder="Type Your Message..." required></textarea>
          </div>
          <button type="submit">send</button>
        </form>
      </div>
    </section>
  </body>
</html>
